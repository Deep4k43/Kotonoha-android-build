name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool nasm yasm

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ github.run_id }}
          restore-keys: vcpkg-

      - name: Restore Gradle wrapper jar
        run: |
          V=$(grep distributionUrl Android/gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-(bin|all)\.zip.*/\1/')
          echo "Gradle version: $V"
          mkdir /tmp/w && cd /tmp/w
          touch settings.gradle
          gradle wrapper --gradle-version "$V"
          cp /tmp/w/gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/Android/gradle/wrapper/gradle-wrapper.jar"

      - name: Build example debug APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleExampleDebug -Pabis=arm64-v8a -PbundleGameAssets=false --stacktrace

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: kotonoha-apk
          path: Android/app/build/outputs/apk/**/*.apk
